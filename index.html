<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f1e8" />
    <meta name="description" content="Review contract clauses, compare execution terms and trace decisions in LegalX." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta property="og:title" content="LEGALX" />
    <meta property="og:description" content="Review contract clauses, compare execution terms and trace decisions in LegalX." />
    <meta property="og:type" content="website" />
    <title>LegalX — Agreement intelligence</title>
    <script>
      // Theme bootstrap: runs synchronously before first paint so the stored
      // preference never flashes. Default is the light identity.
      (function () {
        try {
          var stored = window.localStorage.getItem('legalx:theme');
          var theme = stored === 'dark' ? 'dark' : 'light';
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
          document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#101820' : '#f5f1e8';
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
